name: Release

# 打 tag 时构建 VSIX 并创建 GitHub Release。
#
# 为什么用 tag 触发而不是 push main：
#   一次 Release 就是对外的「一个可用版本」，必须由人显式决定何时发布。
#   push main 自动发版会把每次修字都变成版本，用户侧的更新提示也会被刷屏。
#
# 发布前会再跑一遍完整构建门禁。CI 的 ci.yml 已在 push 时跑过，这里重复是
# 有意的：tag 可能打在历史 commit 上（那个 commit 未必经过当前 CI），
# 而且「要发出去的产物」值得单独验证一次。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.0.17)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Cursor++/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Cursor++
        run: pnpm install --frozen-lockfile

      # 发布产物必须先过门禁：线上只产出已验证过的构建
      - name: Build gate (typecheck + lint + tests + build)
        working-directory: Cursor++
        run: node scripts/verify.mjs

      - name: Package VSIX
        working-directory: Cursor++
        run: pnpm exec vsce package --no-dependencies --allow-missing-repository --skip-license --allow-star-activation

      - name: Read version from package.json
        id: meta
        working-directory: Cursor++
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=cursor2plus-$version.vsix" >> "$GITHUB_OUTPUT"

      # tag 与 package.json 版本不一致时直接失败。
      # 更新检测靠比较 tag 与扩展内版本号，两者错位会让用户永远看到「有新版本」。
      - name: Verify tag matches package.json version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          tag_version="${tag#v}"
          pkg_version="${{ steps.meta.outputs.version }}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag '$tag' does not match Cursor++/package.json version '$pkg_version'."
            echo "Bump the version in Cursor++/package.json and installer/package.json before tagging."
            exit 1
          fi
          echo "Tag $tag matches package.json version $pkg_version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Cursor++ BYOK ${{ steps.meta.outputs.version }}
          files: Cursor++/${{ steps.meta.outputs.vsix }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Cursor++ BYOK ${{ steps.meta.outputs.version }}

            安装/更新：扩展会在检测到新版本后提示 **Update Now**，自动下载本 Release 的 VSIX 并覆盖安装。

            手动安装（可选）：
            1. 下载下方 `${{ steps.meta.outputs.vsix }}`
            2. 用 installer 安装，或按 README「方式三」解压覆盖扩展目录
          draft: false
          prerelease: false
